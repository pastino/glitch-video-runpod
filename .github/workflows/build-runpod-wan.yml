name: Build RunPod Wan Video Docker Image

on:
  push:
    branches: [main, master]
    paths:
      - 'runpod-wan/**'
      - '.github/workflows/build-runpod-wan.yml'
  workflow_dispatch:  # 수동 실행 가능

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-wan

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 디스크 공간 확보 (CUDA/PyTorch 이미지가 크기 때문에 필요)
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./runpod-wan
          file: ./runpod-wan/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # RunPod 자동 배포 - secrets 미설정 시 스킵
      - name: Deploy to RunPod
        continue-on-error: true
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_WAN_ENDPOINT_ID }}  # ⚠️ WAI 서버리스(RUNPOD_ENDPOINT_ID)를 덮어쓰지 않게 Wan 전용 이름
        run: |
          if [ -z "$RUNPOD_API_KEY" ] || [ -z "$RUNPOD_ENDPOINT_ID" ]; then
            echo "⏭️  RUNPOD_API_KEY 또는 RUNPOD_WAN_ENDPOINT_ID 미설정 — 자동 배포 스킵"
            echo "    (최초 배포 시에는 RunPod 대시보드에서 수동으로 endpoint 생성)"
            exit 0
          fi

          # SHA 태그로 이미지 지정 (캐시 문제 방지)
          # metadata-action의 type=sha,prefix= 설정 때문에 sha- 접두사 없음
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA::7}"
          echo "🚀 Deploying image: $IMAGE_TAG"

          # 1. Endpoint 정보 조회하여 Template ID 가져오기
          echo "📋 Fetching endpoint details..."
          ENDPOINT_RESPONSE=$(curl -s "https://rest.runpod.io/v1/endpoints/${RUNPOD_ENDPOINT_ID}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}")

          TEMPLATE_ID=$(echo "$ENDPOINT_RESPONSE" | jq -r '.templateId // empty')

          if [ -z "$TEMPLATE_ID" ]; then
            echo "❌ Failed to get template ID from endpoint"
            echo "Response: $ENDPOINT_RESPONSE"
            exit 1
          fi

          echo "✅ Found template ID: $TEMPLATE_ID"

          # 2. Template의 이미지 업데이트 (롤링 릴리스 트리거)
          echo "🔄 Updating template image..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH "https://rest.runpod.io/v1/templates/${TEMPLATE_ID}" \
            -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"imageName\": \"${IMAGE_TAG}\"}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ RunPod template updated successfully (HTTP $HTTP_CODE)"
            echo "🎉 Rolling release triggered - workers will update automatically"
          else
            echo "❌ Failed to update RunPod template (HTTP $HTTP_CODE)"
            echo "Response: $BODY"
            exit 1
          fi
